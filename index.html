<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash 模式切换</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#1b1e24; color:#e6e8ee; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#262a33; border-radius:16px; padding:32px 40px; box-shadow:0 8px 30px rgba(0,0,0,.4); min-width:340px; }
  h1 { font-size:20px; margin:0 0 4px; text-align:center; }
  .status { font-size:14px; color:#9aa3b2; margin-bottom:20px; text-align:center; }
  .btn { display:block; width:100%; padding:14px; margin:12px 0; font-size:16px; border-radius:10px; border:2px solid #3a4050; background:#2f3542; color:#e6e8ee; cursor:pointer; transition:all .15s; }
  .btn:hover { border-color:#6a7690; }
  .btn.active { background:#2f6fed; border-color:#2f6fed; color:#fff; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .err { color:#ff7b72; font-size:14px; margin-top:12px; min-height:18px; text-align:center; }
  .sep { border:none; border-top:1px solid #3a4050; margin:24px 0 16px; }
  .panel-title { font-size:15px; color:#9aa3b2; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .badge { font-size:12px; padding:2px 10px; border-radius:8px; background:#2f6fed; color:#fff; }
  .badge.auto { background:#3f8f4f; }
  .node { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; margin:6px 0; border-radius:10px; border:2px solid #3a4050; background:#2f3542; cursor:pointer; transition:all .15s; }
  .node:hover { border-color:#6a7690; }
  .node.current { border-color:#2f6fed; background:#2a3a5c; }
  .node .delay { font-size:14px; color:#9aa3b2; font-variant-numeric:tabular-nums; }
  .node .delay.dead { color:#ff7b72; }
  .row-actions { display:flex; gap:10px; margin-top:14px; }
  .row-actions .btn { flex:1; margin:0; padding:10px; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Clash 代理模式</h1>
  <div class="status" id="status">读取中…</div>
  <button class="btn" id="btn-rule" onclick="setMode('rule')">规则连接</button>
  <button class="btn" id="btn-direct" onclick="setMode('direct')">直连</button>

  <hr class="sep">
  <div class="panel-title">
    <span>出口节点</span>
    <span id="exit-badge"></span>
  </div>
  <div id="nodes"></div>
  <div class="row-actions">
    <button class="btn" id="btn-test" onclick="testAll()">一键测速</button>
    <button class="btn" id="btn-auto" onclick="restoreAuto()">恢复自动选择</button>
  </div>
  <div class="err" id="err"></div>
</div>
<script>
const NAMES = { rule: '规则连接', direct: '直连', global: '全局代理' };
const AUTO_GROUP = '自动选择快速节点';
const PROXY_GROUP = 'PROXY';
const TEST_URL = 'http://www.gstatic.com/generate_204';
const GROUP_TYPES = ['Selector', 'URLTest', 'Fallback', 'LoadBalance'];
const SPECIAL_TYPES = ['Direct', 'Reject', 'RejectDrop', 'Compatible', 'Pass', 'PassRule'];
let nodes = [];
let currentExit = '';

async function getMode() {
  const r = await fetch('/configs');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  return d.mode || 'rule';
}

function render(mode) {
  document.getElementById('status').textContent = '当前模式：' + (NAMES[mode] || mode);
  document.getElementById('btn-rule').classList.toggle('active', mode === 'rule');
  document.getElementById('btn-direct').classList.toggle('active', mode === 'direct');
}

async function setMode(mode) {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/configs', { method: 'PATCH', body: JSON.stringify({ mode }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await getMode());
  } catch (e) {
    err.textContent = '切换失败：' + e.message;
  }
}

function shortName(name) {
  const p = name.split('@');
  return p.length > 1 ? p[1].split('.')[0] : name;
}

function loadNodes() {
  fetch('/proxies')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      nodes = Object.values(d.proxies)
        .filter(p => !GROUP_TYPES.includes(p.type) && !SPECIAL_TYPES.includes(p.type))
        .map(p => ({
          name: p.name,
          short: shortName(p.name),
          delay: (p.history && p.history.length) ? p.history[p.history.length - 1].delay : null,
        }));
      currentExit = d.proxies[PROXY_GROUP].now;
      renderNodes();
    })
    .catch(() => {
      document.getElementById('nodes').textContent = '无法连接 mihomo API（服务是否在运行？）';
    });
}

function renderNodes() {
  const box = document.getElementById('nodes');
  box.innerHTML = '';
  for (const n of nodes) {
    const row = document.createElement('div');
    row.className = 'node' + (currentExit === n.name ? ' current' : '');
    let t = '-', dead = false;
    if (n.delay === 0) { t = '超时'; dead = true; }
    else if (n.delay !== null) { t = n.delay + ' ms'; }
    row.innerHTML = '<span>' + n.short + '</span><span class="delay' + (dead ? ' dead' : '') + '">' + t + '</span>';
    row.onclick = () => pinNode(n.name);
    box.appendChild(row);
  }
  document.getElementById('exit-badge').innerHTML = currentExit === AUTO_GROUP
    ? '<span class="badge auto">自动选择</span>'
    : '<span class="badge">已固定</span>';
}

async function testAll() {
  const btn = document.getElementById('btn-test');
  btn.disabled = true;
  const jobs = nodes.map(n =>
    fetch('/proxies/' + encodeURIComponent(n.name) + '/delay?url=' + encodeURIComponent(TEST_URL) + '&timeout=8000')
      .then(r => r.json())
      .then(d => { n.delay = (typeof d.delay === 'number') ? d.delay : 0; })
      .catch(() => { n.delay = 0; })
      .finally(() => renderNodes())
  );
  await Promise.allSettled(jobs);
  btn.disabled = false;
}

async function pinNode(name) {
  await putProxy(name);
}

async function restoreAuto() {
  await putProxy(AUTO_GROUP);
}

async function putProxy(name) {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/proxies/' + encodeURIComponent(PROXY_GROUP), { method: 'PUT', body: JSON.stringify({ name }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    currentExit = name;
    renderNodes();
  } catch (e) {
    err.textContent = '切换失败：' + e.message;
  }
}

(async () => {
  try {
    render(await getMode());
  } catch (e) {
    document.getElementById('err').textContent = '无法连接 mihomo API（服务是否在运行？）';
  }
  loadNodes();
})();
</script>
</body>
</html>
